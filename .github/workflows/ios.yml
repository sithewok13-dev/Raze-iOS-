name: iOS

# Builds an unsigned Raze.ipa (Duke Nukem 3D, Blood, Shadow Warrior, Redneck
# Rampage and PowerSlave on the Build engine) for iPhone and iPad. Sideload
# it, then copy your own game folders into Files > On My iPhone > Raze.
# No game data is in the app.
#
# Every run keeps the .ipa as a workflow artifact. Where it goes:
#   - a push to ios, or a manual run of ios with "release" left empty: the
#     public "ios-latest" prerelease (Raze.ipa, no game data), as always.
#   - a manual run of branch ios with "release" set to a tag such as ios-v0.1
#     (gh workflow run ios.yml --ref ios -f release=ios-v0.1): a release for
#     that tag, created at the commit being built, with ios/RELEASE_NOTES.md
#     from that commit as its text and only the files in RELEASE_IPAS
#     attached, marked as the latest release. A version with a '-' in it
#     (ios-v0.2-beta1) is a prerelease instead and isn't marked latest.
#     ios-latest is left alone. The run stops before building if it isn't on
#     ios, the tag isn't ios-v<version> or is already on another commit, or
#     the notes have no "### What's in <tag>" line. After publishing, it adds
#     the release to the AltStore / SideStore source (ios/altstore-source.json)
#     and commits that to ios; if that part fails, the release is still out.
#   Running it again for the same tag on the same commit updates that release.
#   - runs on other branches (work in progress) publish nothing.
# Every run checks that no game files ended up in the app.

on:
  push:
    branches: [ "ios" ]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Only on branch ios. Leave empty to
          update ios-latest as usual.
        required: false
        default: ''

concurrency:
  # Pushes and ordinary runs as before (a newer one cancels an older one on
  # the same branch). Release runs for one tag go one at a time and are
  # never cancelled.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release == '' }}

env:
  IOS_MIN: "15.0"
  SDL_TAG: release-2.32.8
  OPENAL_TAG: 1.24.3
  ZMUSIC_SHA: d3b730795784bff3f97571446101c57c1c6ac9bc
  VPX_TAG: v1.15.2
  MOLTENVK_TAG: v1.4.2
  # The tag a manual run was asked to release; empty for pushes and ordinary runs.
  RELEASE_TAG: ${{ inputs.release }}
  # The files a release gets, space-separated.
  RELEASE_IPAS: Raze.ipa
  # Release title; the tag's version is added after it (ios-v0.1 -> "Raze for iOS v0.1").
  RELEASE_TITLE: "Raze for iOS"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      build_date: ${{ steps.stamp.outputs.date }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Before the build: a release needs branch ios, a usable tag and notes
    # written for it.
    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if [ "$GITHUB_REF" != "refs/heads/ios" ]; then
          echo "::error::Releases are made from branch ios only (this run is on $GITHUB_REF)."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's .ipa and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Select newest Xcode
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    - name: Host tools
      run: brew install ninja libvpx

    - name: Restore iOS dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: deps
        key: ios-deps-${{ env.SDL_TAG }}-${{ env.OPENAL_TAG }}-${{ env.ZMUSIC_SHA }}-${{ env.VPX_TAG }}-${{ env.IOS_MIN }}-${{ hashFiles('ios/build_deps.sh', 'ios/zmusic_ios.py') }}

    - name: Build SDL2, OpenAL Soft, libsndfile, ZMusic and libvpx for iOS
      if: steps.deps.outputs.cache-hit != 'true'
      run: ios/build_deps.sh "$PWD/deps"

    - name: Save iOS dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: deps
        key: ${{ steps.deps.outputs.cache-primary-key }}

    # The build makes raze.pk3 with tools that run on the Mac (zipdir, lemon,
    # re2c): build those natively first and hand them to the iOS build.
    - name: Build host tools
      run: |
        set -e
        DEPS=$PWD/deps
        # Only the tools are built here; the game's libraries just have to be
        # found for the configure step (the iOS ones do).
        cmake -S . -B host -G Ninja -DCMAKE_BUILD_TYPE=Release -DFORCE_INTERNAL_BZIP2=ON \
          -DZMUSIC_INCLUDE_DIR=$DEPS/include -DZMUSIC_LIBRARIES=$DEPS/lib/libzmusic.a \
          -DSDL2_INCLUDE_DIR=$DEPS/include/SDL2 -DSDL2_LIBRARY=$DEPS/lib/libSDL2.a \
          -DNO_GTK=ON -DHAVE_VULKAN=OFF \
          -DVPX_INCLUDE_DIR=$(brew --prefix libvpx)/include -DVPX_LIBRARIES=$(brew --prefix libvpx)/lib/libvpx.dylib \
          > host-configure.log 2>&1 || { tail -40 host-configure.log; exit 1; }
        cmake --build host --target zipdir lemon re2c
        test -f host/ImportExecutables.cmake

    - name: Configure
      run: |
        set -e
        DEPS=$PWD/deps
        cmake -S . -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN -DCMAKE_BUILD_TYPE=Release \
          -DIMPORT_EXECUTABLES=$PWD/host/ImportExecutables.cmake \
          -DSDL2_INCLUDE_DIR=$DEPS/include/SDL2 \
          "-DSDL2_LIBRARY=$DEPS/lib/libSDL2main.a;$DEPS/lib/libSDL2.a" \
          -DOPENAL_INCLUDE_DIR=$DEPS/include/AL \
          -DOPENAL_LIBRARY=$DEPS/lib/libopenal.a \
          -DZMUSIC_INCLUDE_DIR=$DEPS/include \
          "-DZMUSIC_LIBRARIES=$DEPS/lib/libzmusic.a;$DEPS/lib/libsndfile.a;$DEPS/lib/libvorbisenc.a;$DEPS/lib/libvorbis.a;$DEPS/lib/libFLAC.a;$DEPS/lib/libopus.a;$DEPS/lib/libogg.a" \
          -DVPX_INCLUDE_DIR=$DEPS/include -DVPX_LIBRARIES=$DEPS/lib/libvpx.a \
          -DNO_GTK=ON \
          -DRAZE_IOS_VERSION=0.1.${{ github.run_number }}

    - name: Build
      run: |
        cmake --build build -- -k 0 > build.log 2>&1 || {
          grep -E "error:|FAILED:|undefined symbol|ld: " build.log | head -120
          echo "----- end of the build log -----"
          tail -80 build.log | cut -c1-400
          echo "::error::Build failed"
          exit 1
        }
        # (the touch controls' files must build without warnings)
        grep -E "(ios/|ios_[a-z]+\.cpp).*warning:" build.log | sort -u | head -60 || true
        tail -3 build.log

    # The build stamp (the run number and the UTC date), shown under the
    # open MENU tray as "build 80 · Nov 9" and on the release's first line
    - name: Build stamp
      id: stamp
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Package .ipa
      run: |
        set -e
        APP=$(find build -maxdepth 3 -name "*.app" -type d | head -1)
        echo "App bundle: $APP"
        ls -la "$APP"
        test -f "$APP/raze.pk3"
        # the picker's pictures (drawn for the port, or open-licensed: ios/art/CREDITS.txt)
        cp ios/art/picker-*.png ios/art/CREDITS.txt "$APP/"
        PL="$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Delete :SWBuildNumber" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Delete :SWBuildDate" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :SWBuildNumber string ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Add :SWBuildDate string ${{ steps.stamp.outputs.date }}" "$PL"
        plutil -lint "$PL"
        plutil -p "$PL" | grep -E "CFBundle(Short)?Version|SWBuild"
        # MoltenVK (Vulkan on Metal), Khronos's own build for iOS, in the
        # app's Frameworks folder (the game loads it at start: ios/i_ios.mm)
        curl -sSfL -o mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_TAG/MoltenVK-ios.tar"
        tar xf mvk.tar
        mkdir -p "$APP/Frameworks"
        cp -R MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework "$APP/Frameworks/"
        cp MoltenVK/LICENSE "$APP/Frameworks/MoltenVK.framework/LICENSE"
        lipo -info "$APP/Frameworks/MoltenVK.framework/MoltenVK"
        codesign --force --sign - --timestamp=none "$APP/Frameworks/MoltenVK.framework"
        # The home-screen icon: the PNGs Info.plist names, at their sizes
        plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconFiles json -o - "$APP/Info.plist"
        plutil -extract 'CFBundleIcons~ipad.CFBundlePrimaryIcon.CFBundleIconFiles' json -o - "$APP/Info.plist"
        for f in AppIcon60x60@2x.png:120 AppIcon60x60@3x.png:180 AppIcon76x76@2x~ipad.png:152 AppIcon83.5x83.5@2x~ipad.png:167; do
          px=$(sips -g pixelWidth "$APP/${f%%:*}" | awk '/pixelWidth/ {print $2}')
          echo "${f%%:*}: ${px} px"
          test "$px" = "${f##*:}" || { echo "::error::App icon ${f%%:*} missing or wrong size"; exit 1; }
        done
        codesign --force --sign - --timestamp=none "$APP"
        mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/
        (cd ipa && zip -qry ../Raze.ipa Payload)
        ls -la Raze.ipa
        # No game data in the app: none of the games' files (GRP, RFF, ART,
        # MAP, STUFF.DAT, sounds, demos, music, movies...) and no zips.
        BAD=$(unzip -Z1 Raze.ipa | grep -iE '\.(grp|rff|art|map|dat|con|rts|dmo|voc|mid|ogg|flac|wav|smk|kvx|zip|7z|exe)$' || true)
        if [ -n "$BAD" ]; then
          echo "$BAD" | head -40
          echo "::error::Game files in the app (above): they must never be bundled."
          exit 1
        fi
        echo "No game data in Raze.ipa"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Raze-ios
        path: Raze.ipa

  release:
    name: ${{ inputs.release != '' && format('Publish release {0}', inputs.release) || 'Publish to "iOS latest" prerelease' }}
    needs: build
    if: github.ref == 'refs/heads/ios'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Release runs only: the notes and the AltStore source's script from the
    # run's commit. Kept first, as checkout empties the folder it checks out into.
    - name: Get release notes
      if: env.RELEASE_TAG != ''
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          ios/RELEASE_NOTES.md
          ios/update_altstore_source.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: actions/download-artifact@v4
      with:
        name: Raze-ios
        path: out

    # Pushes and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish to "ios-latest" prerelease
      if: env.RELEASE_TAG == ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ios-latest
        target_commitish: ${{ github.sha }}
        name: iOS latest build
        prerelease: true
        make_latest: false
        body: |
          Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}
          Development build of Raze for iPhone and iPad, rebuilt after every push to the `ios` branch (run ${{ github.run_number }}, commit ${{ github.sha }}). It may not have been tried yet.
          Raze.ipa is unsigned: sideload it, then copy your own game folders (Duke Nukem 3D, Blood, Shadow Warrior, Redneck Rampage) into Files > On My iPhone > Raze. No game data is included.
        files: out/Raze.ipa

    # Release runs: only the files in RELEASE_IPAS, the title and whether it's
    # a prerelease (a '-' in the version, after the "ios-").
    - name: Prepare release
      id: rel
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        mkdir release
        for ipa in $RELEASE_IPAS; do
          if [ ! -f "out/$ipa" ]; then
            echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
            exit 1
          fi
          cp "out/$ipa" release/
        done
        ls -la release
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) PRERELEASE=true; LATEST=false ;;
          *) PRERELEASE=false; LATEST=true ;;
        esac
        echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
        { echo "Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}"; echo; cat ios/RELEASE_NOTES.md; } > release-notes.md
        {
          echo "name=$RELEASE_TITLE $VERSION"
          echo "prerelease=$PRERELEASE"
          echo "latest=$LATEST"
        } >> "$GITHUB_OUTPUT"

    - name: Publish release for the tag
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        # Creates the tag at the commit this run built (left out, GitHub would
        # put a new tag on the default branch, master)
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.rel.outputs.name }}
        body_path: release-notes.md
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        files: release/*.ipa
        fail_on_unmatched_files: true

    # The AltStore / SideStore source (ios/altstore-source.json) gets the
    # release just published: its size, SHA-256, date, download link and a
    # summary of the notes (ios/update_altstore_source.py), committed to ios.
    # A push by GITHUB_TOKEN starts no workflow run (and the message says
    # [skip ci]), so this publishes no new ios-latest. continue-on-error: if
    # anything here fails, the release (already out) still counts as a success.
    - name: Add the release to the AltStore / SideStore source
      if: env.RELEASE_TAG != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ios
      run: |
        set -euo pipefail
        trap 'echo "::warning::The AltStore / SideStore source was not updated for ${RELEASE_TAG}. The release itself is published; add it to ios/altstore-source.json by hand."' ERR
        SRC="$RUNNER_TEMP/altstore-source"
        rm -rf "$SRC"
        git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SRC"
        git -C "$SRC" config user.name "github-actions[bot]"
        git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3; do
          # The script and the notes come from the commit just built; the
          # source file from the newest ios
          python3 -I ios/update_altstore_source.py \
            --source "$SRC/ios/altstore-source.json" \
            --tag "$RELEASE_TAG" --notes ios/RELEASE_NOTES.md \
            --ipa release/Raze.ipa
          if git -C "$SRC" diff --quiet; then
            echo "The source already has ${RELEASE_TAG}"
            break
          fi
          git -C "$SRC" commit --quiet -am "iOS: add ${RELEASE_TAG} to the AltStore / SideStore source [skip ci]"
          if git -C "$SRC" push --quiet origin "HEAD:${SOURCE_BRANCH}"; then
            echo "Added ${RELEASE_TAG} to the source on ${SOURCE_BRANCH}"
            break
          fi
          if [ "$attempt" = 3 ]; then
            false # gives up (the warning above)
          fi
          # Someone pushed in between: start again from the new branch head
          git -C "$SRC" fetch --quiet --depth 1 origin "$SOURCE_BRANCH"
          git -C "$SRC" reset --quiet --hard FETCH_HEAD
        done
        rm -rf "$SRC"
